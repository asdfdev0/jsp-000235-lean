name: Lean

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Build
        run: lake build
      - name: Check endpoint and axioms
        run: lake env lean JSP000235.lean
      - name: Run audit
        run: lake env lean Audit.lean
