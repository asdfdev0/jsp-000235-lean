name: Lean

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show pinned toolchain
        run: |
          lean --version
          lake --version
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Check endpoint and axioms
        run: lake env lean JSP000235.lean
      - name: Run audit
        run: lake env lean Audit.lean
